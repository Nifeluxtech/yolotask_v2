<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics — YOLOTASK Advertiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/components.css">
<link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
  <div class="dashboard-shell" id="shell">
    <aside id="sidebar-root"></aside>
    <div>
      <header class="topbar">
        <button type="button" class="mobile-menu" aria-label="Menu">&#9776;</button>
        <h3 style="margin:0">Analytics</h3>
        <span></span>
      </header>
      <main class="content">
        <div class="page-title">
          <div class="section-kicker">Performance</div>
          <h1>Campaign analytics</h1>
          <p class="muted">Reach, completion, and approval across all your campaigns.</p>
        </div>
        <div class="metric-grid" id="metrics">
          <div class="metric"><span class="metric-label">Workers reached</span><strong class="metric-value">—</strong></div>
          <div class="metric"><span class="metric-label">Completion rate</span><strong class="metric-value">—</strong></div>
          <div class="metric"><span class="metric-label">Approval rate</span><strong class="metric-value">—</strong></div>
          <div class="metric"><span class="metric-label">Campaigns</span><strong class="metric-value">—</strong></div>
        </div>
        <section class="card panel" style="margin-top:18px" id="analytics-note"></section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/src/pages/advertiser/analytics.js"></script>
</body>
</html>
