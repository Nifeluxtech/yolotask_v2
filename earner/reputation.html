<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reputation — YOLOTASK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/components.css">
<link rel="stylesheet" href="/src/styles/layout.css">
<style>.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}</style>
</head>
<body>
  <div class="dashboard-shell" id="shell">
    <aside id="sidebar-root"></aside>
    <div>
      <header class="topbar">
        <button type="button" class="mobile-menu" aria-label="Menu">&#9776;</button>
        <h3 style="margin:0">Reputation</h3>
        <span></span>
      </header>
      <main class="content">
        <div class="page-title">
          <div class="section-kicker">Trust signal</div>
          <h1>Reputation</h1>
          <p class="muted">Reputation is separate from leaderboard ranking and reflects reliable participation.</p>
        </div>
        <section class="card panel">
          <div class="section-kicker">Earner rank</div>
          <h2 id="rank-title" style="font-size:2.5rem">—</h2>
          <p class="muted" id="rank-progress-copy">Loading…</p>
          <div class="progress"><i id="progress-bar" style="width:4%"></i></div>
          <div class="list" style="margin-top:20px">
            <div class="list-item"><span>Approved tasks</span><strong id="stat-tasks">0</strong></div>
            <div class="list-item"><span>Referrals</span><strong id="stat-referrals">0</strong></div>
            <div class="list-item"><span>Current XP</span><strong id="stat-xp">0</strong></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/src/pages/earner/reputation.js"></script>
</body>
</html>
