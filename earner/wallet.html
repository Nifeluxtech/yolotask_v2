<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet — YOLOTASK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/components.css">
<link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
  <div class="dashboard-shell" id="shell">
    <aside id="sidebar-root"></aside>
    <div>
      <header class="topbar">
        <button type="button" class="mobile-menu" aria-label="Menu">&#9776;</button>
        <h3 style="margin:0">Wallet</h3>
        <span></span>
      </header>
      <main class="content">
        <div class="page-title">
          <div class="section-kicker">Financial centre</div>
          <h1>Wallet</h1>
          <p class="muted">All balance changes are recorded in a server-controlled, immutable ledger.</p>
        </div>
        <div class="metric-grid" id="metrics">
          <div class="metric"><span class="metric-label">Available balance</span><strong class="metric-value">—</strong></div>
          <div class="metric"><span class="metric-label">Pending balance</span><strong class="metric-value">—</strong></div>
          <div class="metric"><span class="metric-label">Locked balance</span><strong class="metric-value">—</strong></div>
        </div>
        <section class="card panel" style="margin-top:18px">
          <div class="panel-head">
            <h3>Transaction history</h3>
            <button type="button" class="btn btn-primary btn-small" id="withdraw-btn">Request withdrawal</button>
          </div>
          <div class="list" id="transaction-list"><p class="muted">Loading…</p></div>
        </section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/src/pages/earner/wallet.js"></script>
</body>
</html>
