<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — YOLOTASK Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/components.css">
<link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
  <div class="dashboard-shell" id="shell">
    <aside id="sidebar-root"></aside>
    <div>
      <header class="topbar">
        <button type="button" class="mobile-menu" aria-label="Menu">&#9776;</button>
        <h3 style="margin:0">Overview</h3>
        <span></span>
      </header>
      <main class="content">
        <div class="page-title">
          <div class="section-kicker">Platform control</div>
          <h1>Admin overview</h1>
          <p class="muted">Everything that needs your attention, at a glance.</p>
        </div>
        <div class="dashboard-grid cols-2">
          <section class="card panel">
            <h3 style="margin-bottom:14px">People</h3>
            <div class="metric-grid" id="people-metrics">
              <div class="metric"><span class="metric-label">Earners</span><strong class="metric-value">—</strong></div>
              <div class="metric"><span class="metric-label">Activated earners</span><strong class="metric-value">—</strong></div>
              <div class="metric"><span class="metric-label">Advertisers</span><strong class="metric-value">—</strong></div>
            </div>
          </section>
          <section class="card panel">
            <h3 style="margin-bottom:14px">Needs attention</h3>
            <div class="metric-grid" id="attention-metrics">
              <div class="metric"><span class="metric-label">Campaigns to review</span><strong class="metric-value">—</strong></div>
              <div class="metric"><span class="metric-label">Task proofs to review</span><strong class="metric-value">—</strong></div>
              <div class="metric"><span class="metric-label">Withdrawals pending</span><strong class="metric-value">—</strong></div>
            </div>
          </section>
        </div>
        <section class="card panel" style="margin-top:18px">
          <h3 style="margin-bottom:14px">Campaigns</h3>
          <div class="metric-grid" id="campaign-metrics">
            <div class="metric"><span class="metric-label">Total campaigns</span><strong class="metric-value">—</strong></div>
            <div class="metric"><span class="metric-label">Live now</span><strong class="metric-value">—</strong></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/src/pages/admin/overview.js"></script>
</body>
</html>
